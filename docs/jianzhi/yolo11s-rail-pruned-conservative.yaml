# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11s 钢轨划痕检测 - 保精度剪枝版本（参考 yolov8s-pruned-multiscale 策略）
#
# 剪枝策略（对标 yolov8s-pruned-multiscale 思路）：
#   - yolov8s-pruned-multiscale：保持通道宽度不变，仅削减 C2f repeats 深度
#   - 本方案同理：yolo11s 的 depth=0.50 已使 repeats 压缩至最小值1（无法再削减）
#     因此改为：保持 P5/深层通道和 C2PSA 完全不变，仅轻度削减 P3/P4 中层通道
#   - 浅层 P1/P2 完全不动（对精度影响最小），P3 112→仍从原128削减12.5%，P4 224→从256削减12.5%
#   - P5 深层（512）和 C2PSA 完整保留，权重可 100% 复用
#
# 通道对照：
#   层级          原始 yolo11s    本方案(conservative)    变化
#   P1(Conv0)        32              32                 不变
#   P2(Conv1)        64              64                 不变
#   P3(C3k2)        128             112                -12.5%
#   P4(C3k2)        256             224                -12.5%
#   P5(C3k2+SPPF)   512             512                不变 ✓
#   C2PSA           512             512                完整保留 ✓
#
# 指标预估（实测）：
#   参数量：8.55M（原始 9.46M，↓9.6%）
#   GFLOPs：18.2（原始 21.7，↓16.1%）
#   权重迁移：272/499（P5/SPPF/C2PSA 层完整复用，精度损失预计 <2%）

# Parameters
nc: 4  # 钢轨划痕检测类别数（clipping/lightband/perlage/seams）
scales:
  s: [1.00, 1.00, 1024]  # depth=width=1.00，yaml 中通道数即为实际值（不缩放）

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]]           # 0-P1/2,  原32 → 保持32（不动）
  - [-1, 1, Conv, [64, 3, 2]]           # 1-P2/4,  原64 → 保持64（不动）
  - [-1, 1, C3k2, [112, False, 0.25]]   # 2,       原128 → 112（-12.5%，浅层中层语义）
  - [-1, 1, Conv, [112, 3, 2]]          # 3-P3/8,  原128 → 112
  - [-1, 1, C3k2, [224, False, 0.25]]   # 4,       原256 → 224（-12.5%，中层语义）
  - [-1, 1, Conv, [224, 3, 2]]          # 5-P4/16, 原256 → 224
  - [-1, 1, C3k2, [224, True]]          # 6,       原256 → 224
  - [-1, 1, Conv, [512, 3, 2]]          # 7-P5/32, 原512 → 保持512（深层语义不变）✓
  - [-1, 1, C3k2, [512, True]]          # 8,       原512 → 保持512 ✓
  - [-1, 1, SPPF, [512, 5]]             # 9,       保持512，多尺度感受野完整 ✓
  - [-1, 1, C2PSA, [512]]               # 10,      完整保留注意力机制，512可被16整除 ✓

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]           # cat backbone P4 (512 + 224 = 736)
  - [-1, 1, C3k2, [224, False]]         # 13, 原256 → 224

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]           # cat backbone P3 (224 + 112 = 336)
  - [-1, 1, C3k2, [112, False]]         # 16 (P3/8-small), 原128 → 112

  - [-1, 1, Conv, [112, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]          # cat head P4 (112 + 224 = 336)
  - [-1, 1, C3k2, [224, False]]         # 19 (P4/16-medium), 原256 → 224

  - [-1, 1, Conv, [224, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]          # cat head P5 (224 + 512 = 736)
  - [-1, 1, C3k2, [512, True]]          # 22 (P5/32-large), 原512 → 保持512 ✓

  - [[16, 19, 22], 1, Detect, [nc]]     # Detect(P3, P4, P5)
